# PrintFlow/PrintPass — Nginx reverse proxy (TLS terminated here).
# Points at the PM2-managed Next.js server on 127.0.0.1:3000.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;

upstream printflow_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name printpass.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name printpass.app;

    # certbot manages these
    ssl_certificate     /etc/letsencrypt/live/printpass.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printpass.app/privkey.pem;

    client_max_body_size 110m;   # uploads: 25 MB/file, 100 MB/job
    proxy_read_timeout   300s;

    # SSE (realtime) — no buffering, long timeouts
    location /api/events {
        proxy_pass http://printflow_web;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signed file downloads
    location /api/files/ {
        proxy_pass http://printflow_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/api/(auth|shop/auth|payments) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://printflow_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads — moderate rate limit
    location /jobs/new {
        limit_req zone=upload burst=10 nodelay;
        proxy_pass http://printflow_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else
    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://printflow_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
